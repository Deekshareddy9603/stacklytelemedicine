<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 - Page Not Found | Stackly Telemedicine</title>

  <!-- Google Fonts: Plus Jakarta Sans & Caveat -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">

  <style>
    /* ================= 404 PAGE STYLING ================= */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      background: radial-gradient(circle at 50% 30%, #f0f9ff 0%, #e0f2fe 50%, #ffffff 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow-x: hidden;
      color: #0f172a;
      padding: 20px;
    }

    /* Ambient Background Glows */
    body::before,
    body::after {
      content: '';
      position: absolute;
      width: 400px;
      height: 400px;
      border-radius: 50%;
      background: rgba(2, 132, 199, 0.12);
      filter: blur(100px);
      pointer-events: none;
    }

    body::before {
      top: -100px;
      left: -100px;
    }

    body::after {
      bottom: -100px;
      right: -100px;
    }

    /* Main Error Card Wrapper */
    .error-card {
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(16px);
      border: 1px solid #e2e8f0;
      border-radius: 32px;
      padding: 50px 40px;
      max-width: 620px;
      width: 100%;
      text-align: center;
      box-shadow: 0 25px 50px -12px rgba(15, 23, 42, 0.12);
      position: relative;
      z-index: 2;
      transition: transform 0.3s ease;
    }

    .error-card:hover {
      transform: translateY(-4px);
    }

    /* Floating Pill Badge */
    .error-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(2, 132, 199, 0.1);
      color: #0284c7;
      font-size: 0.85rem;
      font-weight: 700;
      padding: 6px 18px;
      border-radius: 50px;
      margin-bottom: 20px;
      border: 1px solid rgba(2, 132, 199, 0.2);
    }

    /* 404 Large Number */
    .error-code {
      font-size: 6.5rem;
      font-weight: 800;
      line-height: 1;
      letter-spacing: -3px;
      background: linear-gradient(135deg, #0284c7 0%, #0d9488 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 10px;
    }

    .error-title {
      font-size: 2rem;
      font-weight: 800;
      color: #0f172a;
      margin-bottom: 12px;
      letter-spacing: -0.5px;
    }

    .error-message {
      font-size: 1.05rem;
      color: #64748b;
      line-height: 1.6;
      margin-bottom: 35px;
    }

    /* Buttons Group */
    .btn-group {
      display: flex;
      gap: 16px;
      justify-content: center;
      align-items: center;
    }

    .btn-back {
      background-color: #ffffff;
      color: #0f172a;
      border: 1px solid #cbd5e1;
      padding: 14px 28px;
      border-radius: 50px;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.3s ease;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      text-decoration: none;
      box-shadow: 0 4px 12px rgba(15, 23, 42, 0.04);
    }

    .btn-back:hover {
      background-color: #f8fafc;
      border-color: #0284c7;
      color: #0284c7;
      transform: translateY(-2px);
    }

    .btn-home {
      background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
      color: #ffffff;
      border: none;
      padding: 14px 28px;
      border-radius: 50px;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.3s ease;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      text-decoration: none;
      box-shadow: 0 6px 20px rgba(2, 132, 199, 0.3);
    }

    .btn-home:hover {
      background: linear-gradient(135deg, #38bdf8 0%, #0284c7 100%);
      transform: translateY(-2px);
      box-shadow: 0 10px 25px rgba(2, 132, 199, 0.45);
    }

    /* Handwritten Accent Text */
    .handwritten-note {
      font-family: 'Caveat', cursive, sans-serif;
      color: #0284c7;
      font-size: 1.25rem;
      font-weight: 700;
      margin-top: 30px;
    }

    /* Responsive Design */
    @media (max-width: 576px) {
      .error-card {
        padding: 40px 24px;
        border-radius: 24px;
      }
      .error-code {
        font-size: 4.8rem;
      }
      .error-title {
        font-size: 1.6rem;
      }
      .btn-group {
        flex-direction: column;
        width: 100%;
      }
      .btn-back, .btn-home {
        width: 100%;
        justify-content: center;
      }
    }
  </style>
</head>
<body>

  <!-- 404 ERROR CARD CONTAINER -->
  <div class="error-card">
    <div class="error-pill">
      🔍 Page Not Found
    </div>

    <div class="error-code">404</div>

    <h1 class="error-title">Oops! Looks Like You're Lost</h1>

    <p class="error-message">
      The page or doctor search result you are looking for might have been moved, renamed, or is temporarily unavailable.
    </p>

    <!-- ACTION BUTTONS -->
    <div class="btn-group">
      <button type="button" class="btn-back" onclick="window.history.back()">
        &larr; Go Back
      </button>

      <a href="index.html" class="btn-home">
        Go to Home Page &rarr;
      </a>
    </div>

    <div class="handwritten-note">
      We're always here for your care ♡
    </div>
  </div>

</body>
</html>
